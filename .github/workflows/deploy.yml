name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy client
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./client/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/24/client/"

      # Phase 1: uncomment once server/ exists
      # - name: Deploy server
      #   run: |
      #     rsync -az -e "ssh -i ~/.ssh/id_ed25519" \
      #       ./server/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/24/server/"
      #     ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
      #       'cd /srv/24/server && npm ci --omit=dev && npm run build && sudo systemctl restart 24'

      - name: Smoke test
        run: |
          sleep 3
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://24.namastevis.in/)
          echo "GET / -> $code"
          test "$code" = "200"
